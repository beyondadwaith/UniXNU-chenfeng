name: Build Xiaomi 14 Civi (chenfeng) iOS Port

on:
  workflow_dispatch:

jobs:
  prepare-and-inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git device-tree-compiler python3

      - name: Clone Xiaomi DTs & UniXNU
        run: |
          mkdir -p work && cd work
          git clone --depth=1 -b chenfeng-u-oss https://github.com/MiCode/kernel_devicetree.git
          git clone --depth=1 -b chenfeng-u-oss https://github.com/MiCode/vendor_qcom_proprietary_display-devicetree.git
          git clone --depth=1 https://github.com/hoshikv/UniXNU-peridot.git unixnu

      - name: Extract Splash Memory & Build Scripts
        run: |
          cd work
          mkdir -p out-step2
          
          {
            echo "=== 1. CLIFFS RESERVED MEMORY (SPLASH / PIL) ==="
            cat kernel_devicetree/qcom/cliffs-reserved-memory.dtsi || true
            
            echo "=== 2. DISPLAY DEVICETREE FILES & SPLASH ==="
            find vendor_qcom_proprietary_display-devicetree/ -type f
            grep -rn -C 15 "splash\|1236\|2750\|chenfeng" vendor_qcom_proprietary_display-devicetree/ || true
            
            echo "=== 3. BUILD-UNIXNU.SH & APPLY-PERIDOT-FIRMWARE.PY ==="
            cat unixnu/scripts/build-unixnu.sh
            echo "----------------------------------------"
            cat unixnu/scripts/apply-peridot-firmware.py
            echo "----------------------------------------"
            cat unixnu/docs/building.md
            echo "----------------------------------------"
            cat unixnu/docs/devices/peridot.md
          } > out-step2/chenfeng-build-info.txt

      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        with:
          name: chenfeng-step2-info
          path: work/out-step2/
          
