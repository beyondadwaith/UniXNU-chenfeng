name: Build Xiaomi 14 Civi (chenfeng) iOS Port

on:
  workflow_dispatch:

jobs:
  compile-chenfeng-os:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git patch flex bison bzip2 cpio rsync curl wget \
            ca-certificates tcsh unifdef cmake clang lld mtools build-essential \
            gcc-multilib pkg-config ninja-build python3 python3-dev python3-pip \
            python3-venv xz-utils libssl-dev zlib1g-dev libbsd-dev uuid-dev \
            llvm-dev libclang-dev device-tree-compiler bc jq unzip zip gawk mawk
          sudo mkdir -p /opt/unixnu-linux
          sudo chown -R runner:runner /opt/unixnu-linux

      - name: Cache Linux XNU Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-linux-toolchain-v3
          restore-keys: |
            unixnu-linux-toolchain-v3
            unixnu-linux-toolchain-v2

      - name: Clone UniXNU-peridot & Mu-Silicium UEFI
        run: |
          mkdir -p work && cd work
          git clone --recurse-submodules https://github.com/hoshikv/UniXNU-peridot.git unixnu
          git clone --depth=1 https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium

      - name: Set Up Linux XNU Toolchain & Wrap clang-24
        run: |
          cd work/unixnu
          mkdir -p final-output
          if [ -f /opt/unixnu-linux/xcrun.cached ] && [ ! -x /usr/local/bin/xcrun ]; then
            sudo cp -f /opt/unixnu-linux/xcrun.cached /usr/local/bin/xcrun
            sudo chmod +x /usr/local/bin/xcrun
          fi
          if ! command -v xcrun >/dev/null 2>&1 || [ ! -e /opt/unixnu-linux/llvm/bin/clang ]; then
            echo "Running scripts/linux/setup-toolchain.py..." >> final-output/build.log
            sudo python3 scripts/linux/setup-toolchain.py > final-output/toolchain.log 2>&1
            sudo cp -f /usr/local/bin/xcrun /opt/unixnu-linux/xcrun.cached 2>/dev/null || true
          else
            echo "Using cached /opt/unixnu-linux toolchain!" >> final-output/build.log
          fi
          if [ ! -f /opt/unixnu-linux/llvm/bin/clang-24.real ]; then
            sudo mv /opt/unixnu-linux/llvm/bin/clang-24 /opt/unixnu-linux/llvm/bin/clang-24.real
          fi
          sudo python3 -c 'import pathlib; p = pathlib.Path("/opt/unixnu-linux/llvm/bin/clang-24"); p.write_text("#!/usr/bin/env python3\nimport os, sys\nreal = \"/opt/unixnu-linux/llvm/bin/clang-24.real\"\nargs = sys.argv[1:]\nif not args or args[0] not in (\"-cc1\", \"-cc1as\"):\n    if any(a.startswith(\"--target=\") or a == \"-target\" for a in args):\n        args = [a for a in args if not a.startswith((\"-mios-version-min=\", \"-miphoneos-version-min=\", \"-mmacosx-version-min=\"))]\n    args.extend([\"-Wno-overriding-option\", \"-Wno-error=overriding-option\"])\nos.execv(real, [real] + args)\n"); p.chmod(0o755)'
          sudo chown -R runner:runner /opt/unixnu-linux
          echo "Toolchain and clang-24 wrapper ready." >> final-output/build.log

      - name: Patch Hardware Values & Fix Clang 24 __ptrauth Macro
        run: |
          cd work/unixnu
          sed -i 's/#define TB_TOUCH_MAX_X   19520/#define TB_TOUCH_MAX_X   19776/g' kits/peridot/TouchBoard.h
          sed -i 's/#define TB_TOUCH_MAX_Y   43400/#define TB_TOUCH_MAX_Y   44000/g' kits/peridot/TouchBoard.h
          sed -i 's/Xiaomi Poco F6 \/ Redmi Turbo 3/Xiaomi 14 Civi (chenfeng)/g' dts/peridot.dts
          python3 -c 'import pathlib; p = pathlib.Path("scripts/prepare-xnu-source.py"); p.write_text(p.read_text() + "\nimport pathlib\nfor d in [\".cache/xnu-work\", \"refer/libplatform\", \".cache/fakeroot\"]:\n    r = pathlib.Path(d)\n    if r.exists():\n        for h in r.rglob(\"*.h\"):\n            t = h.read_text(errors=\"ignore\")\n            if \"authenticates-null-values\" in t:\n                h.write_text(t.replace(\", \\\"authenticates-null-values\\\"\", \"\"))\n")'
          cp kits/peridot/TouchBoard.h final-output/
          cp dts/peridot.dts final-output/chenfeng.dts
          cp board.toml final-output/

      - name: Fetch Feeds, IPSW, Build DTB, Package, Kernel & Boot Image
        run: |
          cd work/unixnu
          export JOBS=$(nproc)
          export C_INCLUDE_PATH=/usr/include/x86_64-linux-gnu
          export CPLUS_INCLUDE_PATH=/usr/include/x86_64-linux-gnu
          {
            echo "=== 1. Running unixnu defconfig & fetch ==="
            ./unixnu defconfig peridot_defconfig -D .
            ./unixnu fetch
            grep -rl '"authenticates-null-values"' out/feeds/ 2>/dev/null | xargs -r sed -i 's/, *"authenticates-null-values"//g' || true

            echo "=== 2. Fetching IPSW KernelCache via Range Requests ==="
            ./unixnu ipsw fetch || true

            echo "=== 3. Assembling build tree & Compiling DTB ==="
            ./unixnu tree
            ./unixnu build dtb || true
            SOC_DTS_DIR=$(find out -type f -name "sm8550.dtsi" -printf "%h\n" | head -n 1)
            dtc -I dts -O dtb -i "$SOC_DTS_DIR" -i dts -o final-output/chenfeng.dtb dts/peridot.dts
            echo "Compiled final-output/chenfeng.dtb successfully!"

            echo "=== 4. Building UEFI Package (UniXNU.efi) ==="
            ./unixnu build package || true

            echo "=== 5. Building XNU Kernel & Driver Archives ==="
            ./unixnu build kernel || true

            echo "=== 6. Building Mu-Silicium UEFI Firmware & Boot Image ==="
            ./unixnu build firmware --uefi ../Mu-Silicium || true
            ./unixnu build payload || true
            ./unixnu bootimg --uefi ../Mu-Silicium --dtb final-output/chenfeng.dtb -o final-output/boot-chenfeng.img || ./unixnu bootimg --uefi ../Mu-Silicium || true
          } 2>&1 | tee -a final-output/build.log

      - name: Collect Compiled Binaries & Log Summaries
        if: always()
        run: |
          cd work/unixnu
          mkdir -p final-output
          cp -f ../Mu-Silicium/Build/peridotPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd final-output/ 2>/dev/null || true
          find build out -type f \( -name "*.efi" -o -name "*.macho" -o -name "*.unstripped" -o -name "*.img" -o -name "*.fd" -o -name "*.dtb" -o -name "boot*.json" -o -name "payload.json" \) -exec cp --parents {} final-output/ \; 2>/dev/null || true
          echo "=== Tail of Step Logs ===" >> final-output/build.log
          for lfile in out/peridot/ios-27.0.1-24A446/peridot/logs/*.log; do
            if [ -f "$lfile" ] && [[ "$lfile" != *"kernel-bootstrap.log" ]]; then
              echo "--- $lfile (last 30 lines) ---" >> final-output/build.log
              tail -n 30 "$lfile" >> final-output/build.log
            fi
          done
          echo "=== Final Collected Files ===" >> final-output/build.log
          ls -lhR final-output/ >> final-output/build.log

      - name: Upload Clean Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-chenfeng-artifacts
          path: work/unixnu/final-output/
          
