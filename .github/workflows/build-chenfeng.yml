name: Build Xiaomi 14 Civi (chenfeng) iOS Port

on:
  workflow_dispatch:

jobs:
  compile-chenfeng-os:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git patch flex bison bzip2 cpio rsync curl wget \
            ca-certificates tcsh unifdef cmake clang lld mtools build-essential \
            gcc-multilib pkg-config ninja-build python3 python3-dev python3-pip \
            python3-venv xz-utils libssl-dev zlib1g-dev libbsd-dev uuid-dev \
            llvm-dev libclang-dev device-tree-compiler bc jq unzip zip gawk mawk

      - name: Cache Linux XNU Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            /opt/unixnu-linux
            /usr/local/bin/xcrun
          key: unixnu-linux-toolchain-v2
          restore-keys: |
            unixnu-linux-toolchain-v2
            unixnu-linux-toolchain-v1

      - name: Clone UniXNU-peridot & Mu-Silicium UEFI
        run: |
          mkdir -p work && cd work
          git clone --recurse-submodules https://github.com/hoshikv/UniXNU-peridot.git unixnu
          git clone --depth=1 https://github.com/Project-Silicium/Mu-Silicium.git Mu-Silicium

      - name: Set Up Linux XNU Toolchain & Wrap clang-24
        run: |
          cd work/unixnu
          mkdir -p final-output

          if [ -f /opt/unixnu-linux/xcrun.cached ] && [ ! -x /usr/local/bin/xcrun ]; then
            sudo cp -f /opt/unixnu-linux/xcrun.cached /usr/local/bin/xcrun
            sudo chmod +x /usr/local/bin/xcrun
          fi

          if ! command -v xcrun >/dev/null 2>&1 || [ ! -x /opt/unixnu-linux/llvm/bin/clang ]; then
            echo "Running scripts/linux/setup-toolchain.py..." >> final-output/build.log
            sudo python3 scripts/linux/setup-toolchain.py > final-output/toolchain.log 2>&1
            sudo cp -f /usr/local/bin/xcrun /opt/unixnu-linux/xcrun.cached 2>/dev/null || true
          else
            echo "Using cached /opt/unixnu-linux toolchain!" >> final-output/build.log
          fi

          if [ ! -f /opt/unixnu-linux/llvm/bin/clang-24.real ]; then
            sudo mv /opt/unixnu-linux/llvm/bin/clang-24 /opt/unixnu-linux/llvm/bin/clang-24.real
          fi

          cat << 'EOF' | sudo tee /opt/unixnu-linux/llvm/bin/clang-24 >/dev/null
          #!/usr/bin/env bash
          if [ "${1:-}" = "-cc1" ] \vert{}\vert{} [ "${1:-}" = "-cc1as" ]; then
            exec /opt/unixnu-linux/llvm/bin/clang-24.real "$@"
          fi
          HAS_TARGET=0
          for arg in "$@"; do
            case "$arg" in
              --target=*|-target) HAS_TARGET=1 ;;
            esac
          done
          ARGS=()
          for arg in "$@"; do
            if [ "$HAS_TARGET" -eq 1 ]; then
              case "$arg" in
                -mios-version-min=*|-miphoneos-version-min=*|-mmacosx-version-min=*)
                  continue
                  ;;
              esac
            fi
            ARGS+=("$arg")
          done
          exec /opt/unixnu-linux/llvm/bin/clang-24.real "${ARGS[@]}" -Wno-overriding-option -Wno-error=overriding-option
          EOF
          sudo chmod +x /opt/unixnu-linux/llvm/bin/clang-24
          echo "Toolchain and clang-24 wrapper ready." >> final-output/build.log

      - name: Patch Hardware Values & Fix Clang 24 __ptrauth Macro
        run: |
          cd work/unixnu

          # 1. Patch TouchBoard.h for Xiaomi 14 Civi 1236x2750 display (19776 x 44000 in 1/16th pixel units)
          sed -i 's/#define TB_TOUCH_MAX_X   19520/#define TB_TOUCH_MAX_X   19776/g' kits/peridot/TouchBoard.h
          sed -i 's/#define TB_TOUCH_MAX_Y   43400/#define TB_TOUCH_MAX_Y   44000/g' kits/peridot/TouchBoard.h

          # 2. Update model description in peridot.dts
          sed -i 's/Xiaomi Poco F6 \/ Redmi Turbo 3/Xiaomi 14 Civi (chenfeng)/g' dts/peridot.dts

          # 3. Strip 4th argument from __ptrauth(..., "authenticates-null-values") for Linux Clang 24
          cat << 'EOF' >> scripts/prepare-xnu-source.py

          import pathlib
          for root_dir in [pathlib.Path('.cache/xnu-work'), pathlib.Path('refer/libplatform'), pathlib.Path('.cache/fakeroot')]:
              if root_dir.exists():
                  for hfile in root_dir.rglob('*.h'):
                      try:
                          txt = hfile.read_text(errors='ignore')
                          if '"authenticates-null-values"' in txt:
                              hfile.write_text(txt.replace(', "authenticates-null-values"', ''))
                      except Exception:
                          pass
          EOF

          cp kits/peridot/TouchBoard.h final-output/
          cp dts/peridot.dts final-output/chenfeng.dts
          cp board.toml final-output/

      - name: Fetch Feeds, IPSW, Build DTB, Package, Kernel & Boot Image
        run: |
          cd work/unixnu
          export JOBS=$(nproc)
          export C_INCLUDE_PATH=/usr/include/x86_64-linux-gnu
          export CPLUS_INCLUDE_PATH=/usr/include/x86_64-linux-gnu
          {
            echo "=== 1. Running unixnu defconfig & fetch ==="
            ./unixnu defconfig peridot_defconfig -D .
            ./unixnu fetch

            grep -rl '"authenticates-null-values"' out/feeds/ 2>/dev/null | xargs -r sed -i 's/, *"authenticates-null-values"//g' || true

            echo "=== 2. Fetching IPSW KernelCache via Range Requests ==="
            ./unixnu ipsw fetch || true

            echo "=== 3. Assembling build tree & Compiling DTB ==="
            ./unixnu tree
            ./unixnu build dtb || true
            SOC_DTS_DIR=$(
            
