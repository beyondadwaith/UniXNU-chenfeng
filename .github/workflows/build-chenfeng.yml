name: Build Xiaomi 14 Civi (chenfeng) iOS Port

on:
  workflow_dispatch:

jobs:
  compile-chenfeng-os:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git patch flex bison bzip2 cpio rsync curl wget \
            ca-certificates tcsh unifdef cmake clang lld mtools build-essential \
            gcc-multilib pkg-config ninja-build python3 python3-dev python3-pip \
            python3-venv xz-utils libssl-dev zlib1g-dev libbsd-dev uuid-dev \
            llvm-dev libclang-dev device-tree-compiler bc jq unzip zip gawk mawk

      - name: Cache Linux XNU Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            /opt/unixnu-linux
            /usr/local/bin/xcrun
          key: unixnu-linux-toolchain-v2
          restore-keys: |
            unixnu-linux-toolchain-v2
            unixnu-linux-toolchain-v1

      - name: Clone UniXNU-peridot Base
        run: |
          mkdir -p work && cd work
          git clone --recurse-submodules https://github.com/hoshikv/UniXNU-peridot.git unixnu

      - name: Set Up Linux XNU Toolchain (Uses Cache If Available)
        run: |
          cd work/unixnu
          mkdir -p final-output
          if [ -x /opt/unixnu-linux/llvm/bin/clang ] && [ -d /opt/unixnu-linux/CommandLineTools ]; then
            echo "Found cached /opt/unixnu-linux toolchain! Checking xcrun..." >> final-output/build.log
            XCRUN_BIN=$(find /opt/unixnu-linux /usr/local/bin -name "xcrun" -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$XCRUN_BIN" ] && [ ! -x /usr/local/bin/xcrun ]; then
              sudo ln -sf "$XCRUN_BIN" /usr/local/bin/xcrun
            fi
          fi
          if ! command -v xcrun >/dev/null 2>&1 || [ ! -x /opt/unixnu-linux/llvm/bin/clang ]; then
            echo "Running scripts/linux/setup-toolchain.py..." >> final-output/build.log
            sudo python3 scripts/linux/setup-toolchain.py > final-output/toolchain.log 2>&1
            sudo cp -f /usr/local/bin/xcrun /opt/unixnu-linux/xcrun.cached 2>/dev/null || true
          fi
          if [ -f /opt/unixnu-linux/xcrun.cached ] && [ ! -x /usr/local/bin/xcrun ]; then
            sudo cp -f /opt/unixnu-linux/xcrun.cached /usr/local/bin/xcrun
            sudo chmod +x /usr/local/bin/xcrun
          fi
          echo "Toolchain ready." >> final-output/build.log

      - name: Patch Hardware Values & Fix Clang 24 __ptrauth Macro
        run: |
          cd work/unixnu
          
          # 1. Patch TouchBoard.h for Xiaomi 14 Civi 1236x2750 display (19776 x 44000 in 1/16th pixel units)
          sed -i 's/#define TB_TOUCH_MAX_X   19520/#define TB_TOUCH_MAX_X   19776/g' kits/peridot/TouchBoard.h
          sed -i 's/#define TB_TOUCH_MAX_Y   43400/#define TB_TOUCH_MAX_Y   44000/g' kits/peridot/TouchBoard.h

          # 2. Update model description in peridot.dts
          sed -i 's/Xiaomi Poco F6 \/ Redmi Turbo 3/Xiaomi 14 Civi (chenfeng)/g' dts/peridot.dts

          # 3. Hook prepare-xnu-source.py so 4-arg __ptrauth(..., "authenticates-null-values") is converted to 3-arg for Linux Clang 24
          cat << 'EOF' >> scripts/prepare-xnu-source.py

          # Fix 4-argument __ptrauth macro for Linux Clang 24 compatibility
          import pathlib
          for root_dir in [pathlib.Path('.cache/xnu-work'), pathlib.Path('refer/libplatform'), pathlib.Path('.cache/fakeroot')]:
              if root_dir.exists():
                  for hfile in root_dir.rglob('*.h'):
                      try:
                          txt = hfile.read_text(errors='ignore')
                          if '"authenticates-null-values"' in txt:
                              hfile.write_text(txt.replace(', "authenticates-null-values"', ''))
                      except Exception:
                          pass
          EOF

          cp kits/peridot/TouchBoard.h final-output/
          cp dts/peridot.dts final-output/chenfeng.dts
          cp board.toml final-output/

      - name: Fetch Feeds, Build DTB, Package & Kernel
        run: |
          cd work/unixnu
          export JOBS=$(nproc)
          {
            echo "=== 1. Running unixnu defconfig ==="
            ./unixnu defconfig peridot_defconfig -D .

            echo "=== 2. Running unixnu fetch ==="
            ./unixnu fetch

            # Also strip 4-arg __ptrauth in fetched feeds directly
            grep -rl '"authenticates-null-values"' out/feeds/ 2>/dev/null | xargs -r sed -i 's/, *"authenticates-null-values"//g' || true

            echo "=== 3. Assembling build tree ==="
            ./unixnu tree

            echo "=== 4. Compiling chenfeng.dtb ==="
            SOC_DTS_DIR=$(find out -type f -name "sm8550.dtsi" -printf "%h\n" | head -n 1)
            dtc -I dts -O dtb -i "$SOC_DTS_DIR" -i dts -o final-output/chenfeng.dtb dts/peridot.dts
            echo "Compiled final-output/chenfeng.dtb successfully!"

            echo "=== 5. Building UEFI Package (UniXNU.efi) ==="
            C_INCLUDE_PATH=/usr/include/x86_64-linux-gnu CPLUS_INCLUDE_PATH=/usr/include/x86_64-linux-gnu ./unixnu build package || true

            echo "=== 6. Building XNU Kernel ==="
            ./unixnu build kernel || true

          } 2>&1 | tee -a final-output/build.log

      - name: Collect Outputs & Failure Logs
        run: |
          cd work/unixnu
          find build out -type f \( -name "*.efi" -o -name "*.macho" -o -name "*.unstripped" -o -name "*.img" -o -name "*.fd" -o -name "*.dtb" -o -name "*.log" \) -exec cp --parents {} final-output/ \; 2>/dev/null || true
          echo "=== Final Collected Files ===" >> final-output/build.log
          ls -lhR final-output/ >> final-output/build.log

      - name: Upload Clean Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-chenfeng-artifacts
          path: work/unixnu/final-output/
          
