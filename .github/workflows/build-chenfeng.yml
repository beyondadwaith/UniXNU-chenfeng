name: Build Xiaomi 14 Civi (chenfeng) iOS Port

on:
  workflow_dispatch:

jobs:
  compile-chenfeng-os:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Build Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git device-tree-compiler python3 python3-pip \
            python3-venv build-essential clang lld llvm curl jq unzip zip bc \
            bison flex libssl-dev libelf-dev cpio ninja-build cmake mtools \
            unifdef mawk gawk uuid-dev zlib1g-dev

      - name: Clone UniXNU, SM8550 SoC Common & Xiaomi chenfeng DTs
        run: |
          mkdir -p work && cd work
          git clone --depth=1 https://github.com/UniXNU/UniXNU.git unixnu || git clone --depth=1 https://github.com/hoshikv/UniXNU-peridot.git unixnu
          git clone --depth=1 https://github.com/UniXNU/UniXNU-sm8550-common.git sm8550_common || true
          git clone --depth=1 -b chenfeng-u-oss https://github.com/MiCode/kernel_devicetree.git
          git clone --depth=1 -b chenfeng-u-oss https://github.com/MiCode/vendor_qcom_proprietary_display-devicetree.git

      - name: Link Shared SoC Headers & Apply Hardware Overrides
        run: |
          cd work/unixnu
          mkdir -p final-output

          # 1. Copy required SM8550 headers into dts/ include path (DO NOT compile .dtsi directly!)
          if [ -d "../sm8550_common/dts" ]; then
            cp -f ../sm8550_common/dts/*.dtsi dts/ 2>/dev/null || true
            cp -f ../sm8550_common/dts/*.h dts/ 2>/dev/null || true
          fi

          if [ -d "../kernel_devicetree/qcom" ]; then
            cp -f ../kernel_devicetree/qcom/*.dtsi dts/ 2>/dev/null || true
            cp -f ../kernel_devicetree/qcom/*.h dts/ 2>/dev/null || true
          fi

          if [ ! -f "dts/sm8550.dtsi" ]; then
            curl -s https://raw.githubusercontent.com/MiCode/kernel_devicetree/chenfeng-u-oss/qcom/sm8550.dtsi -o dts/sm8550.dtsi || true
          fi

          # 2. Create chenfeng.dts from peridot.dts
          cp dts/peridot.dts dts/chenfeng.dts
          sed -i 's/peridot/chenfeng/g; s/Poco F6 \/ Redmi Turbo 3/Xiaomi 14 Civi/g' dts/chenfeng.dts

          # 3. Update board.toml for chenfeng
          sed -i 's/name = "peridot"/name = "chenfeng"/g' board.toml
          sed -i 's/description = "Xiaomi Poco F6 \/ Redmi Turbo 3"/description = "Xiaomi 14 Civi (chenfeng)"/g' board.toml
          sed -i 's/defconfig = "peridot_defconfig"/defconfig = "chenfeng_defconfig"/g' board.toml
          sed -i 's/source = "device:dts\/peridot.dts"/source = "device:dts\/chenfeng.dts"/g' board.toml
          sed -i 's/model = "xiaomi,peridot"/model = "xiaomi,chenfeng"/g' board.toml

          # 4. Patch TouchBoard.h for 1236x2750 scaling
          sed -i 's/#define TB_TOUCH_MAX_X   19520/#define TB_TOUCH_MAX_X   19776/g' kits/peridot/TouchBoard.h
          sed -i 's/#define TB_TOUCH_MAX_Y   43400/#define TB_TOUCH_MAX_Y   44000/g' kits/peridot/TouchBoard.h

          # 5. Create defconfigs
          cp configs/peridot_defconfig configs/chenfeng_defconfig
          cp configs/peridot-gpu_defconfig configs/chenfeng-gpu_defconfig

          # 6. Compile ONLY the top-level device tree (chenfeng.dts)
          dtc -I dts -O dtb -i dts -o final-output/chenfeng.dtb dts/chenfeng.dts 2>&1 | tee -a final-output/build.log

      - name: Set Up Linux XNU Toolchain & Compile Kernel
        run: |
          cd work/unixnu
          {
            if [ -f scripts/linux/setup-toolchain.py ]; then
              sudo python3 scripts/linux/setup-toolchain.py
            fi

            export JOBS=$(nproc)
            export UNIXNU_XNU_ARCH=arm64

            if [ -x ./unixnu ]; then
              ./unixnu defconfig chenfeng_defconfig -D .
              ./unixnu fetch || true
              ./unixnu status --json || true
              ./unixnu build package || true
              ./unixnu build kernel || true
            else
              bash scripts/build-unixnu.sh || true
              XNU_BOOTSTRAP=1 bash scripts/build-xnu-4k-baseline.sh || true
            fi
          } 2>&1 | tee -a final-output/build.log || true

      - name: Collect Compiled Outputs & Logs
        run: |
          cd work/unixnu
          cp board.toml final-output/
          cp dts/chenfeng.dts final-output/
          cp kits/peridot/TouchBoard.h final-output/
          find build out -type f \( -name "*.efi" -o -name "*.macho" -o -name "*.unstripped" -o -name "*.img" -o -name "*.fd" -o -name "*.dtb" -o -name "*.json" \) -exec cp --parents {} final-output/ \; 2>/dev/null || true
          ls -lhR final-output/ | tee -a final-output/build.log

      - name: Upload Build Output & Full Log
        uses: actions/upload-artifact@v4
        with:
          name: boot-chenfeng-artifacts
          path: work/unixnu/final-output/
          
