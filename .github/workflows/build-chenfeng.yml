name: Build Xiaomi 14 Civi (chenfeng) iOS Port

on:
  workflow_dispatch:

jobs:
  compile-chenfeng-os:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git patch flex bison bzip2 cpio rsync curl wget \
            ca-certificates tcsh unifdef cmake clang lld mtools build-essential \
            pkg-config ninja-build python3 python3-dev python3-pip python3-venv \
            xz-utils libssl-dev zlib1g-dev libbsd-dev uuid-dev llvm-dev \
            libclang-dev device-tree-compiler bc jq unzip zip gawk mawk

      - name: Cache Linux XNU Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/unixnu-linux
          key: unixnu-linux-toolchain-v1

      - name: Clone UniXNU-peridot Base
        run: |
          mkdir -p work && cd work
          git clone --recurse-submodules https://github.com/hoshikv/UniXNU-peridot.git unixnu

      - name: Set Up Linux XNU Toolchain (Logged Separately)
        run: |
          cd work/unixnu
          mkdir -p final-output
          echo "Setting up Linux XNU toolchain..."
          sudo python3 scripts/linux/setup-toolchain.py > final-output/toolchain.log 2>&1 || {
            echo "Toolchain setup failed! Last 50 lines:" >> final-output/build.log
            tail -n 50 final-output/toolchain.log >> final-output/build.log
            exit 1
          }
          echo "Toolchain setup succeeded." >> final-output/build.log

      - name: Patch Hardware Values for Xiaomi 14 Civi (chenfeng)
        run: |
          cd work/unixnu
          
          # 1. Patch TouchBoard.h for Xiaomi 14 Civi 1236x2750 display (19776 x 44000 in 1/16th pixel units)
          sed -i 's/#define TB_TOUCH_MAX_X   19520/#define TB_TOUCH_MAX_X   19776/g' kits/peridot/TouchBoard.h
          sed -i 's/#define TB_TOUCH_MAX_Y   43400/#define TB_TOUCH_MAX_Y   44000/g' kits/peridot/TouchBoard.h

          # 2. Update model description in peridot.dts while keeping internal build target paths intact
          sed -i 's/Xiaomi Poco F6 \/ Redmi Turbo 3/Xiaomi 14 Civi (chenfeng)/g' dts/peridot.dts

          cp kits/peridot/TouchBoard.h final-output/
          cp dts/peridot.dts final-output/chenfeng.dts
          cp board.toml final-output/

      - name: Fetch Feeds, Build DTB, Package & Kernel
        run: |
          cd work/unixnu
          export JOBS=$(nproc)
          export PATH="/opt/unixnu-linux/CommandLineTools/usr/bin:/opt/unixnu-linux/llvm/bin:$PATH"
          {
            echo "=== 1. Running unixnu defconfig ==="
            ./unixnu defconfig peridot_defconfig -D .

            echo "=== 2. Running unixnu fetch ==="
            ./unixnu fetch

            echo "=== 3. Running unixnu status ==="
            ./unixnu status

            echo "=== 4. Assembling build tree ==="
            ./unixnu tree || true

            echo "=== 5. Compiling chenfeng.dtb with fetched sm8550.dtsi ==="
            SOC_DTS_DIR=$(find out -type f -name "sm8550.dtsi" -printf "%h\n" | head -n 1)
            echo "Found sm8550.dtsi in: $SOC_DTS_DIR"
            if [ -n "$SOC_DTS_DIR" ]; then
              dtc -I dts -O dtb -i "$SOC_DTS_DIR" -i dts -o final-output/chenfeng.dtb dts/peridot.dts
              echo "Compiled final-output/chenfeng.dtb successfully!"
            fi

            echo "=== 6. Building UEFI Package (UniXNU.efi) ==="
            ./unixnu build package || true

            echo "=== 7. Building XNU Kernel ==="
            ./unixnu build kernel || true

          } 2>&1 | tee -a final-output/build.log

      - name: Collect Outputs
        run: |
          cd work/unixnu
          find build out -type f \( -name "*.efi" -o -name "*.macho" -o -name "*.unstripped" -o -name "*.img" -o -name "*.fd" -o -name "*.dtb" -o -name "*.json" -o -name "*.log" \) -exec cp --parents {} final-output/ \; 2>/dev/null || true
          echo "=== Final Collected Files ===" >> final-output/build.log
          ls -lhR final-output/ >> final-output/build.log

      - name: Upload Clean Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-chenfeng-artifacts
          path: work/unixnu/final-output/
          
